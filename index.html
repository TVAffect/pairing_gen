<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Генератор пейрингов</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="main">
            <div class="block">
                <div class="slidable" id="slide1">
                    Это... Генератор пейрингов.  <br>
                    <br>
                    Выберите список<br>
                    <br>
                    <button type="button" class="std" id="choice-1-1-next">Шизополка</button><br>
                    <br>
                    <button type="button" class="std" id="choice-1-2-next">Хаукка</button><br>
                    <br>
                    <button type="button" class="std" id="choice-1-3-next">AvA</button><br>
                    <br>
                    <button type="button" class="std" id="choice-1-4-next">Кроссовер</button><br>
                </div>
                <div class="slidable" id="slide2">
                    <button type="button" class="std" id="choice-2-1-next">Полный рандом</button><br>
                    <br>
                    <i>или</i><br>
                    <br>
                    <button type="button" class="std" id="choice-2-2-next">С определённым участником</button><br>
                    <br>
                    <button type="button" class="back" id="back2">Назад к спискам</button>
                </div>
                <div class="slidable" id="slide22">
                    Какой именно кроссовер?<br>
                    <br>
                    <button type="button" class="std" id="choice-22-1-next">Вообще все</button><br>
                    <br>
                    <button type="button" class="back" id="back22">Назад к спискам</button>
                </div>
                <div class="slidable" id="slide3">
                    Пейринг готов!<br>
                    <br>
                    <div id="output"></div>
                    <br>
                    <button type="button" class="back" id="back3">Начать заново</button>
                </div>
                <div class="slidable" id="slide33">
                    Выберите того, кого хотите видеть в пейринге:<br>
                    <br>
                    <div id="container"></div><br>
                    <button type="button" class="std" id="choice-33-1-next">Сгенерировать!</button><br>
                    <br>
                    <button type="button" class="back" id="back33">Назад</button>
                </div>
                <div class="slidable" id="slide11">
                    <button type="button" class="std" id="choice-11-1-next">Персонажи</button><br>
                    <br>
                    <button type="button" class="std" id="choice-11-2-next">Ролевики</button><br>
                    <br>
                    <button type="button" class="std" id="choice-11-3-next">Персонажи + ролевики</button><br>
                    <br>
                    <button type="button" class="std" id="choice-11-4-next">DLC</button><br>
                    <br>
                    <button type="button" class="back" id="back11">Назад к спискам</button>
                </div>
                <div class="slidable" id="slide111">
                    <button type="button" class="std" id="choice-111-1-next">Только канон</button><br>
                    <br>
                    <button type="button" class="std" id="choice-111-2-next">"Вся та ролка"</button><br>
                    <br>
                    <button type="button" class="back" id="back111">Назад к спискам</button>
                </div>
            </div>
        </div>
    </body>
</html>
