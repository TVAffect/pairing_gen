<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Генератор пейрингов</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="main">
            <div class="block">
                <div class="slidable" id="slide-prim-list">
                    Это... Генератор пейрингов.  <br>
                    <br>
                    Выберите список<br>
                    <br>
                    <button type="button" class="std" id="choice-schizorip">Шизополка</button><br>
                    <br>
                    <button type="button" class="std" id="choice-haukka">Хаукка</button><br>
                    <br>
                    <button type="button" class="std" id="choice-ava">AvA</button><br>
                    <br>
                    <button type="button" class="std" id="choice-crossover">Кроссовер</button><br>
                </div>
                <div class="slidable" id="slide-participants">
                    <button type="button" class="std" id="choice-random">Полный рандом</button><br>
                    <br>
                    <i>или</i><br>
                    <br>
                    <button type="button" class="std" id="choice-defined">С определённым участником</button><br>
                    <br>
                    <button type="button" class="back" id="back-primlists">Назад к спискам</button>
                </div>
                <div class="slidable" id="slide-which-crossover">
                    Какой именно кроссовер?<br>
                    <br>
                    <button type="button" class="std" id="choice-everyone">Вообще все</button><br>
                    <br>
                    <button type="button" class="back-primlists">Назад к спискам</button>
                </div>
                <div class="slidable" id="slide-done">
                    Пейринг готов!<br>
                    <br>
                    <div id="output"></div>
                    <br>
                    <button type="button" class="back-primlists">Начать заново</button>
                </div>
                <div class="slidable" id="slide-def-participant">
                    Выберите того, кого хотите видеть в пейринге:<br>
                    <br>
                    <div id="container"></div><br>
                    <button type="button" class="std" id="choice-generate-with-def">Сгенерировать!</button><br>
                    <br>
                    <button type="button" class="back-def">Назад</button>
                </div>
                <div class="slidable" id="slide-sublists-schizorip">
                    <button type="button" class="std" id="choice-schizorip=chars">Персонажи</button><br>
                    <br>
                    <button type="button" class="std" id="choice-schizorip-roleplayers">Ролевики</button><br>
                    <br>
                    <button type="button" class="std" id="choice-schizorip-both">Персонажи + ролевики</button><br>
                    <br>
                    <button type="button" class="std" id="choice-schizorip-dlc">DLC</button><br>
                    <br>
                    <button type="button" class="back-primlists">Назад к спискам</button>
                </div>
                <div class="slidable" id="slide-sublists-ava">
                    <button type="button" class="std" id="choice-ava-canon">Только канон</button><br>
                    <br>
                    <button type="button" class="std" id="choice-ava-thatrp">"Вся та ролка"</button><br>
                    <br>
                    <button type="button" class="back-primlists">Назад к спискам</button>
                </div>
            </div>
        </div>
    </body>
</html>
